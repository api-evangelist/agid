      quote: "Fatto salvo ogni altro ricorso amministrativo o giurisdizionale, è diritto degli interessati proporre reclamo al Garante per la protezione dei dati personali qualora ritengano che il trattamento dei propri dati violi il Regolamento."
    note: >-
      GDPR data-subject rights (access, rectification, erasure, restriction, objection, portability) are
