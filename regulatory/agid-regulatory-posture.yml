      quote: "Gli interessati hanno il diritto di ottenere da AgID l’accesso ai propri dati personali, la rettifica o la cancellazione degli stessi, la limitazione del relativo trattamento, il diritto di opporvisi e il diritto alla portabilità dei dati, laddove ne ricorrano i presupposti. Le richieste vanno rivolte ad AGID, contattando il responsabile della protezione dei dati."
    - source: https://www.agid.gov.it/it/privacy-policy
      http_status: 200
