      quote: "L’Agenzia tratta autonomamente i dati personali mediante il proprio personale e i fornitori di servizi tecnici e telematici. Non è contemplato alcun trasferimento in Paesi terzi o organizzazioni internazionali."
    note: >-
      Says personal data from the website is not transferred to third countries or international
