apis:
- aid: agid:protocollo-comunicazione-aoo
  name: AgID Protocollo Comunicazione AOO (SOAP interface)
  description: SOAP interface definitions published by AgID for the exchange of protocolled electronic
    administrative documents between Areas of Homogeneous Organization (AOO mittente / AOO destinataria),
    part of AgID's guidelines on the electronic administrative document (art. 71 CAD). The interface
    is a national standard implemented and self-hosted by each public administration; the WSDLs carry
    only a localhost test address, so no central base URL exists.
  humanURL: https://github.com/AgID/protocollo-comunicazione-aoo
  tags:
  - SOAP
  - Interoperability
  - Protocollo Informatico
  properties:
  - type: WSDL
    name: Protocollo AOO Mittente (sender) WSDL
    url: wsdl/agid-protocollo-aoo-mittente.wsdl
  - type: WSDL
    name: Protocollo AOO Destinatario (recipient) WSDL
    url: wsdl/agid-protocollo-aoo-destinatario.wsdl
  - type: WSDL
    name: WSDL (provider-hosted)
    url: https://raw.githubusercontent.com/AgID/protocollo-comunicazione-aoo/master/interfaces_SOAP/protocollo-mittente.wsdl
  - type: GitHubRepository
    url: https://github.com/AgID/protocollo-comunicazione-aoo

