aid: agid

name: AgID (Agenzia per l'Italia Digitale)

description: 'AgID (Agenzia per l''Italia Digitale) is the Italian government agency for digital innovation
  in the public administration, describing itself as "innovazione al servizio della PA e dei cittadini.
  Regolamentazione e certificazioni digitali." It publishes national technical guidelines (Linee Guida),
  oversees accessibility, open data and open-source reuse, and maintains public repositories under the
  AgID GitHub organization. It surfaced via the API Evangelist harvest backlog through a Spectral ruleset
  for Italian OpenAPI guidelines (the Italian OpenAPI Checker).'

